<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070c10" />
<title>CHIBAIT — SLOPWATER V1</title>
<style>
  :root {
    --safe-top:0px;--safe-right:0px;--safe-bottom:0px;--safe-left:0px;
    color-scheme:dark;font-family:ui-monospace,Menlo,Consolas,monospace
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070c10;color:#dce2dc}
  body{overscroll-behavior:none}
  #shell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
  main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:0}
  #stage{width:384px;height:256px;background:#0a2634;overflow:hidden;flex-shrink:0}
  #game-root,#game-root canvas{display:block;width:384px;height:256px}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  #touch-controls{display:none}
  button{font-family:inherit;user-select:none;touch-action:none}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px}
  .pad,.action{background:#111b23;color:#e7ece7;border:2px solid #50606b;font-weight:bold;font-size:16px}
  .pad:active,.pressed{background:#4d2e58;border-color:#af8cbb}
  .up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}
  .right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}
  .action{width:79px;height:79px;border-radius:50%;color:#e8d78c}
  .hint{display:none;color:#91aaa9;font-size:10px;line-height:1}
  @media(max-width:760px),(pointer:coarse){
    #shell{padding-left:calc(6px + var(--safe-left));padding-right:calc(6px + var(--safe-right))}
    main{gap:5px;max-height:100%;width:100%}
    #touch-controls{display:flex;align-items:center;justify-content:space-between;
      gap:12px;width:min(100%,350px);min-height:141px;padding:1px 3px}
    .hint{display:block}
  }
  @media(pointer:coarse) and (max-height:440px) {
    #touch-controls{min-height:101px;width:min(100%,280px)}
    .dpad{grid-template-columns:repeat(3,33px);grid-template-rows:repeat(3,33px);gap:2px}
    .action{width:64px;height:64px;font-size:12px}
  }
</style>
</head>
<body>
<div id="shell"><main>
  <div id="stage"><div id="game-root"></div></div>
  <div class="hint">SLOPWATER · GRID MOVEMENT</div>
  <div id="touch-controls" aria-label="Touch movement">
    <div class="dpad">
      <button class="pad up" data-dir="up" aria-label="Move up">▲</button>
      <button class="pad left" data-dir="left" aria-label="Move left">◀</button>
      <button class="pad right" data-dir="right" aria-label="Move right">▶</button>
      <button class="pad down" data-dir="down" aria-label="Move down">▼</button>
    </div>
    <button class="action" disabled aria-label="Fishing will be available next milestone">FISH<br>SOON</button>
  </div>
</main></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
